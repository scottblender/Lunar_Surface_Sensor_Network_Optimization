name: MATLAB optimizer and analysis smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Global_Optimization_Toolbox Parallel_Computing_Toolbox
      - name: Start display for graphics regressions
        run: |
          sudo apt-get install -y xvfb x11-utils
          Xvfb :99 -screen 0 2560x1600x24 -nolisten tcp > /tmp/lunar-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if xdpyinfo -display :99 > /dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/lunar-xvfb.log
          exit 1
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); results = runSmokeTests;
