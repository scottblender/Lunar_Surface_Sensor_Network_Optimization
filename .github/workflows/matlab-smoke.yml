name: MATLAB scientific and paper workflow smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Global_Optimization_Toolbox Parallel_Computing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); results = runSmokeTests;
