name: MATLAB scientific and paper workflow smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
          products: Global_Optimization_Toolbox Parallel_Computing_Toolbox
      - name: Start virtual display for figure export tests
        run: |
          sudo apt-get install -y xvfb x11-utils
          Xvfb :99 -screen 0 2560x1600x24 -nolisten tcp > /tmp/lunar-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if xdpyinfo -display :99 > /dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/lunar-xvfb.log
          exit 1
      - uses: matlab-actions/run-command@v2
        name: Validate sweep and export polar previews
        timeout-minutes: 6
        env:
          LUNAR_GA_PLOT_ARTIFACTS: ${{ github.workspace }}/results/ga_plot_preview
        with:
          command: setupProject; addpath('tests/fixtures'); s = testsuite('tests/optimization/testGaConvergenceStudy.m'); s = s(~endsWith(string({s.Name}),'/testIndependentRunParallelismMatchesSerial')); r = run(s); assertSuccess(r);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-location-plot-preview
          path: results/ga_plot_preview/
          if-no-files-found: ignore
      - uses: matlab-actions/run-command@v2
        name: Validate independent-run parallelism
        timeout-minutes: 6
        with:
          command: setupProject; addpath('tests/fixtures'); s = testsuite('tests/optimization/testGaConvergenceStudy.m'); r = run(s(endsWith(string({s.Name}),'/testIndependentRunParallelismMatchesSerial'))); assertSuccess(r);
      - uses: matlab-actions/run-command@v2
        timeout-minutes: 8
        with:
          command: addpath('tests'); results = runSmokeTests;
